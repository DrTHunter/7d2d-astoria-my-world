<title>Astoria 8K &#8212; Added POIs</title>
<style>
:root{
  --ground:#141109; --panel:#1c1811; --panel-2:#221d14; --ridge:#332c1e;
  --ink:#ece5d3; --ink-dim:#b3a992; --muted:#8a8069; --ochre:#e2952b; --ochre-dim:#8a5c1a;
  --display:"Bahnschrift","Segoe UI Semibold",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 348px;height:100vh}
@media (max-width:900px){.shell{grid-template-columns:1fr;grid-template-rows:62vh 1fr;height:auto}}

.stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#1d1810 0%,var(--ground) 70%);
  cursor:grab;touch-action:none}
.stage.drag{cursor:grabbing}
.world{position:absolute;top:50%;left:50%;width:min(94%,94vh);aspect-ratio:1;transform-origin:0 0;
  will-change:transform;border:1px solid var(--ridge);background:#0d0b07}

/* layer stack - every layer is the whole 8192 m world, north up, so they all
   register against each other and against the pins with no offset */
.stack{position:absolute;inset:0}
.lyr{position:absolute;inset:0;width:100%;height:100%;display:none}
.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.grid line{vector-effect:non-scaling-stroke;fill:none}
.grid .halo line{stroke:#000;stroke-width:3}
.grid .halo .min{stroke-opacity:.26}
.grid .halo .maj{stroke-opacity:.40}
.grid .top line{stroke:#fff;stroke-width:1}
.grid .top .min{stroke-opacity:.30}
.grid .top .maj{stroke-opacity:.70}
.grid{display:none}
.grid.on{display:block}
#layer{position:absolute;inset:0;z-index:50}

.pin{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));border-radius:50%;
  border:2px solid currentColor;background:#0d0b07;width:14px;height:14px;
  display:grid;place-items:center;font:600 8px/1 var(--mono);color:inherit;padding:0;cursor:pointer}
.pin:hover,.pin:focus-visible,.pin.on{width:26px;height:26px;font-size:11px;z-index:5;
  outline:none;box-shadow:0 0 0 3px #0d0b07,0 0 0 5px currentColor}
.pin.town{box-shadow:0 0 0 2px #0d0b07,0 0 0 3px rgba(255,255,255,.55)}
.pin.town:hover,.pin.town:focus-visible,.pin.town.on{box-shadow:0 0 0 3px #0d0b07,0 0 0 5px currentColor}
/* spawn points: square, so they read as a different class of thing to the round POI pins */
.spawn{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));width:20px;height:20px;
  border:2px solid var(--ink);background:#0d0b07;color:var(--ink);padding:0;cursor:pointer;z-index:6;
  font:600 9px/1 var(--mono);display:grid;place-items:center}
.spawn:hover,.spawn:focus-visible,.spawn.on{outline:none;
  box-shadow:0 0 0 3px #0d0b07,0 0 0 5px var(--ochre)}
.fp{position:absolute;border:1px solid currentColor;background:currentColor;opacity:.22;pointer-events:none}
.pin[hidden],.fp[hidden],.spawn[hidden]{display:none}

.hud{position:absolute;left:18px;top:18px;pointer-events:none;z-index:11}
.hud h1{margin:0;font:600 15px/1.2 var(--display);letter-spacing:.16em;text-transform:uppercase}
.hud p{margin:4px 0 0;font:400 11px/1.4 var(--mono);color:var(--muted)}
.hud .crd{color:var(--ochre-dim);letter-spacing:.06em}

/* layer panel */
.panel{position:absolute;right:18px;top:18px;width:238px;z-index:12;
  background:var(--panel);border:1px solid var(--ridge);border-radius:3px;
  display:flex;flex-direction:column;max-height:calc(100% - 84px)}
.panel .head{display:flex;align-items:center;gap:8px;width:100%;padding:10px 13px;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--ridge);color:var(--ink-dim);
  font:600 10px/1 var(--display);letter-spacing:.2em;text-transform:uppercase}
.panel .head:hover{color:var(--ochre)}
.panel .head:focus-visible{outline:2px solid var(--ochre);outline-offset:-2px}
.panel .head b{margin-left:auto;font:400 13px/1 var(--body);transition:transform .15s}
.panel.min .head{border-bottom:0}
.panel.min .head b{transform:rotate(-90deg)}
.panel.min .body{display:none}
.body{overflow-y:auto;padding:2px 0 10px}
.lgrp{padding:12px 13px 4px;font:600 9.5px/1 var(--display);letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted)}
.lrow{padding:3px 13px}
.lrow label{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink-dim);font-size:12px}
.lrow label:hover{color:var(--ink)}
.lrow input[type=radio],.lrow input[type=checkbox]{accent-color:var(--ochre);margin:0;flex:none}
.lrow kbd{margin-left:auto;font:400 9px/1 var(--mono);color:var(--muted);
  border:1px solid var(--ridge);border-radius:2px;padding:2px 4px}
.lrow s{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow input[type=range]{width:100%;margin:5px 0 2px;accent-color:var(--ochre-dim);height:3px}
.lrow.off input[type=range]{opacity:.3}
.hint{padding:0 13px 6px 34px;font:400 10px/1.4 var(--mono);color:var(--muted)}
.legend{padding:2px 13px 4px 34px;display:none;flex-wrap:wrap;gap:3px 10px}
.legend.show{display:flex}
.legend span{display:flex;align-items:center;gap:5px;font:400 10px/1.5 var(--mono);color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:2px;font-style:normal;border:1px solid rgba(0,0,0,.4)}

.zoom{position:absolute;right:18px;bottom:18px;display:flex;gap:6px;z-index:11}
.zoom button{width:34px;height:34px;font:400 16px/1 var(--body);color:var(--ink-dim);
  background:var(--panel);border:1px solid var(--ridge);border-radius:3px;cursor:pointer}
.zoom #zmap{width:auto;padding:0 11px;font:600 10px/1 var(--display);letter-spacing:.14em}
.zoom button:hover{color:var(--ochre);border-color:var(--ochre-dim)}
.zoom button:focus-visible{outline:2px solid var(--ochre);outline-offset:1px}
.tip{position:absolute;pointer-events:none;z-index:60;opacity:0;transition:opacity .1s;
  background:#0d0b07;border:1px solid var(--ridge);border-left:3px solid currentColor;padding:7px 10px;max-width:260px}
.tip.show{opacity:1}
.tip b{display:block;font:600 12px/1.3 var(--display);letter-spacing:.04em;color:var(--ink)}
.tip span{display:block;font:400 11px/1.5 var(--mono);color:var(--ink-dim)}

.rail{background:var(--panel);border-left:1px solid var(--ridge);display:flex;flex-direction:column;min-height:0}
.rail header{padding:20px 20px 14px;border-bottom:1px solid var(--ridge)}
.rail header h2{margin:0;font:600 13px/1.2 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--ochre)}
.rail header p{margin:6px 0 0;font-size:12px;color:var(--muted)}
.tools{padding:14px 20px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--ridge)}
.tools input{width:100%;padding:8px 10px;background:var(--ground);color:var(--ink);
  border:1px solid var(--ridge);border-radius:3px;font:400 13px/1.2 var(--body)}
.tools input::placeholder{color:var(--muted)}
.tools input:focus-visible{outline:none;border-color:var(--ochre-dim);box-shadow:0 0 0 2px rgba(226,149,43,.15)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--ridge);border-radius:2px;font:400 11px/1.3 var(--body);color:var(--ink-dim)}
.chip:hover{border-color:var(--ochre-dim)}
.chip:focus-visible{outline:2px solid var(--ochre);outline-offset:1px}
.chip i{width:9px;height:9px;border-radius:2px;background:currentColor;font-style:normal}
.chip[aria-pressed="false"]{opacity:.4}
.chip em{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:10px}
.roster{overflow-y:auto;flex:1;min-height:0;padding:6px 0 24px}
.grp{padding:16px 20px 5px;font:600 10px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:baseline;width:100%;text-align:left;
  padding:6px 20px;background:none;border:0;cursor:pointer;font-family:var(--body);font-size:12.5px;
  color:var(--ink-dim);border-left:2px solid transparent}
.row:hover,.row.on{background:var(--panel-2);color:var(--ink);border-left-color:currentColor}
.row:focus-visible{outline:none;background:var(--panel-2);border-left-color:var(--ochre)}
.row u{text-decoration:none;font:400 10px/1 var(--mono);color:currentColor;opacity:.75}
.row s{text-decoration:none;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row var{font:400 10.5px/1 var(--mono);color:var(--muted);font-style:normal;font-variant-numeric:tabular-nums}
.row[hidden],.grp[hidden]{display:none}
.foot{padding:12px 20px;border-top:1px solid var(--ridge);font-size:11px;color:var(--muted)}
.foot code{font-family:var(--mono);color:var(--ochre);font-size:11px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:#0d0b07;border:1px solid var(--ochre-dim);color:var(--ink);padding:9px 16px;
  font:400 12px/1 var(--mono);opacity:0;transition:.16s;pointer-events:none;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <div class="stage" id="stage">
    <div class="world" id="world">
      <div class="stack" id="stack"></div>
      <svg class="grid" id="grid" viewBox="0 0 8192 8192" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="layer"></div>
    </div>
    <div class="hud">
      <h1>Astoria 8K</h1>
      <p>122 mod POIs &#183; 73 in town lots (ringed) &#183; 49 wild &#183; 10 spawn points (squares)</p>
      <p class="crd" id="crd">&#160;</p>
    </div>
    <div class="panel" id="panel">
      <button class="head" id="panelHead" aria-expanded="true" aria-controls="panelBody">Layers <b>&#9662;</b></button>
      <div class="body" id="panelBody"></div>
    </div>
    <div class="zoom">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">&#8722;</button>
      <button id="zmap" title="Next base map (M, shift+M back)">MAP</button>
      <button id="zfit" title="Reset view" style="font-size:11px">FIT</button>
    </div>
    <div class="tip" id="tip"></div>
  </div>

  <aside class="rail">
    <header>
      <h2>Added POIs</h2>
      <p>Hover to locate. Click to copy a teleport command.</p>
    </header>
    <div class="tools">
      <input id="q" type="search" placeholder="Filter by name&#8230;" aria-label="Filter POIs by name">
      <div class="chips" id="chips"></div>
    </div>
    <div class="roster" id="roster"></div>
    <div class="foot">Coordinates are each POI's north-west corner, matching <code>prefabs.xml</code>.</div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
const POIS=__POIS__;
const PACKS=__PACKS__;
const SPAWNS=__SPAWNS__;
const LAYERS=__LAYERS__;
const BIOMES=__BIOMELEGEND__;

const layer=document.getElementById('layer'),roster=document.getElementById('roster'),
      chips=document.getElementById('chips'),tip=document.getElementById('tip'),
      stage=document.getElementById('stage'),world=document.getElementById('world'),
      toast=document.getElementById('toast'),stack=document.getElementById('stack'),
      gridEl=document.getElementById('grid'),crd=document.getElementById('crd');
const off=new Set(),pins=[],rows=[];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------------------------------------------------------------- layers -- */
const SKEY='astoria-map-layers-v1';
const st=(function(){
  const d={base:null,ov:{},mk:{pins:true,fp:true,spawn:true,grid:false},min:false};
  LAYERS.forEach(l=>{
    if(l.kind==='overlay') d.ov[l.id]={on:!!l.on,op:l.op};
    else if(l.def&&!d.base) d.base=l.id;
  });
  try{
    const s=JSON.parse(localStorage.getItem(SKEY));
    if(s){
      if(LAYERS.some(l=>l.id===s.base&&l.kind==='base')) d.base=s.base;
      if(s.ov)for(const k in d.ov){ if(s.ov[k])Object.assign(d.ov[k],s.ov[k]); }
      if(s.mk)Object.assign(d.mk,s.mk);
      d.min=!!s.min;
    }
  }catch(e){}                                    /* private mode, or no storage */
  return d;
})();
function save(){ try{localStorage.setItem(SKEY,JSON.stringify(st));}catch(e){} }

const imgs={};
function imgFor(l){                              /* built on first use, so only
                                                    the layers you turn on load */
  if(imgs[l.id])return imgs[l.id];
  const e=document.createElement('img');
  e.className='lyr'; e.alt=''; e.decoding='async';
  e.style.zIndex=LAYERS.indexOf(l);
  e.addEventListener('error',()=>flash('Layer image missing — '+l.file));
  e.src=l.file;
  stack.appendChild(e); imgs[l.id]=e; return e;
}
function paint(){
  LAYERS.forEach(l=>{
    const on=l.kind==='base'?st.base===l.id:st.ov[l.id].on;
    if(!on){ if(imgs[l.id])imgs[l.id].style.display='none'; return; }
    const e=imgFor(l);
    e.style.display='block';
    e.style.opacity=l.kind==='base'?1:st.ov[l.id].op/100;
  });
  gridEl.classList.toggle('on',st.mk.grid);   /* not .hidden: an <svg> is not an HTMLElement */
  document.querySelectorAll('.legend').forEach(el=>{
    el.classList.toggle('show',el.dataset.who==='base'
      ? st.base==='biomes-b'
      : !!(st.ov['biomes-o']&&st.ov['biomes-o'].on));
  });
  apply(); save();
}

const bases=LAYERS.filter(l=>l.kind==='base');
function setBase(id){
  st.base=id;
  document.querySelectorAll('input[name=base]').forEach(i=>i.checked=i.value===id);
  paint();
}
function cycleBase(dir){
  const i=bases.findIndex(l=>l.id===st.base);
  const n=bases[(i+dir+bases.length)%bases.length];
  setBase(n.id); flash(n.label);
}
(function buildPanel(){
  const body=document.getElementById('panelBody');
  const grp=t=>{const d=document.createElement('div');d.className='lgrp';d.textContent=t;body.appendChild(d);};
  const row=()=>{const d=document.createElement('div');d.className='lrow';body.appendChild(d);return d;};
  const hint=t=>{const d=document.createElement('div');d.className='hint';d.textContent=t;body.appendChild(d);};

  grp('Base map');
  bases.forEach((l,i)=>{
    const d=row();
    d.innerHTML='<label><input type="radio" name="base" value="'+l.id+'"><s>'+esc(l.label)+'</s>'
      +(i<9?'<kbd>'+(i+1)+'</kbd>':'')+'</label>';
    const inp=d.querySelector('input');
    inp.checked=st.base===l.id;
    inp.addEventListener('change',()=>{st.base=l.id;paint();});
    if(l.note)hint(l.note);
    if(l.id==='biomes-b')body.appendChild(biomeLegend('base'));
  });

  const ovs=LAYERS.filter(l=>l.kind==='overlay');
  if(ovs.length){
    grp('Overlays');
    ovs.forEach(l=>{
      const s=st.ov[l.id],d=row();
      d.innerHTML='<label><input type="checkbox"><s>'+esc(l.label)+'</s></label>'
        +'<input type="range" min="5" max="100" step="5" aria-label="'+esc(l.label)+' opacity">';
      const cb=d.querySelector('input[type=checkbox]'),rg=d.querySelector('input[type=range]');
      cb.checked=s.on; rg.value=s.op; d.classList.toggle('off',!s.on);
      cb.addEventListener('change',()=>{s.on=cb.checked;d.classList.toggle('off',!s.on);paint();});
      rg.addEventListener('input',()=>{s.op=+rg.value;if(!s.on){s.on=cb.checked=true;d.classList.remove('off');}paint();});
      if(l.note)hint(l.note);
      if(l.id==='biomes-o')body.appendChild(biomeLegend('ov'));
    });
  }

  grp('Markers');
  [['pins','POI pins',''],['fp','POI footprints',''],['spawn','Spawn points',''],
   ['grid','Coordinate grid','G']].forEach(([k,lbl,key])=>{
    const d=row();
    d.innerHTML='<label><input type="checkbox"><s>'+lbl+'</s>'+(key?'<kbd>'+key+'</kbd>':'')+'</label>';
    const cb=d.querySelector('input');
    cb.checked=st.mk[k]; cb.dataset.mk=k;
    cb.addEventListener('change',()=>{st.mk[k]=cb.checked;paint();});
  });
})();

function biomeLegend(who){
  const d=document.createElement('div');
  d.className='legend'; d.dataset.who=who;
  d.innerHTML=BIOMES.map(b=>'<span><i style="background:'+b.c+'"></i>'+esc(b.n)+' '+b.pct+'%</span>').join('');
  return d;
}

const panel=document.getElementById('panel'),panelHead=document.getElementById('panelHead');
function setMin(v){
  st.min=v; panel.classList.toggle('min',v);
  panelHead.setAttribute('aria-expanded',v?'false':'true'); save();
}
panelHead.addEventListener('click',()=>setMin(!st.min));
setMin(st.min);

/* 512 m minor, 1024 m major - the spacing the game's own region files use */
gridEl.innerHTML=(function(){
  let d='';
  for(let v=-4096;v<=4096;v+=512){
    const p=v+4096,c=v%1024?'min':'maj';
    d+='<line class="'+c+'" x1="'+p+'" y1="0" x2="'+p+'" y2="8192"/>'
      +'<line class="'+c+'" x1="0" y1="'+p+'" x2="8192" y2="'+p+'"/>';
  }
  /* drawn twice: a dark halo, then the line itself, so the grid stays legible
     over a near-white snow base and a near-black one alike */
  return '<g class="halo">'+d+'</g><g class="top">'+d+'</g>';
})();

/* ------------------------------------------------------------------ pins -- */
POIS.forEach((p,i)=>{
  const col=PACKS[p.mod].c;
  const fp=document.createElement('div');
  fp.className='fp'; fp.style.color=col;
  fp.style.left=((p.x+4096)/8192*100)+'%';
  fp.style.top=((4096-p.z-p.d)/8192*100)+'%';
  fp.style.width=(p.w/8192*100)+'%';
  fp.style.height=(p.d/8192*100)+'%';
  layer.appendChild(fp);
  const b=document.createElement('button');
  b.className='pin'+(p.where==='town'?' town':''); b.style.color=col; b.textContent=p.n;
  b.style.left=((p.x+p.w/2+4096)/8192*100)+'%';
  b.style.top=((4096-p.z-p.d/2)/8192*100)+'%';
  b.setAttribute('aria-label',p.name+' at X '+p.x+', Z '+p.z);
  b.addEventListener('pointerenter',e=>showTip(p,col,e));
  b.addEventListener('pointerleave',hideTip);
  b.addEventListener('focus',()=>mark(i));
  b.addEventListener('click',()=>copy(p));
  layer.appendChild(b);
  pins.push({b,fp});
});

function showTip(p,col,e){
  tip.style.color=col;
  const site = p.where==='town'
    ? 'town lot · replaced '+esc(p.occ)
    : 'wilderness · '+p.relief+' m ground relief';
  tip.innerHTML='<b>'+esc(p.name)+'</b><span>'+PACKS[p.mod].n+'</span>'
    +'<span>X '+p.x+'   Z '+p.z+'   ·   '+p.w+'×'+p.d+' m</span>'
    +'<span>'+site+'</span>';
  const r=stage.getBoundingClientRect();
  tip.style.left=Math.min(e.clientX-r.left+14,r.width-274)+'px';
  tip.style.top=(e.clientY-r.top+14)+'px';
  tip.classList.add('show');
}
function hideTip(){tip.classList.remove('show');}

/* ---- spawn points ---- */
const spawnEls=[],spawnRows=[];
SPAWNS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='spawn'; b.textContent=s.n;
  b.style.left=((s.x+4096)/8192*100)+'%';
  b.style.top=((4096-s.z)/8192*100)+'%';
  b.setAttribute('aria-label','Spawn point '+s.n+' at X '+s.x+', Z '+s.z);
  b.addEventListener('pointerenter',e=>showSpawnTip(s,e));
  b.addEventListener('pointerleave',hideTip);
  b.addEventListener('focus',()=>markSpawn(i));
  b.addEventListener('click',()=>copyXYZ(s.x,s.y,s.z));
  layer.appendChild(b); spawnEls.push(b);
});
function showSpawnTip(s,e){
  tip.style.color='var(--ink)';
  tip.innerHTML='<b>Spawn point '+s.n+'</b><span>'+s.biome+'</span>'
    +'<span>X '+s.x+'   Z '+s.z+'   ·   ground '+s.y+' m</span>'
    +'<span>nearest added POI: '+esc(s.near)+', '+s.dist+' m</span>';
  const r=stage.getBoundingClientRect();
  tip.style.left=Math.min(e.clientX-r.left+14,r.width-274)+'px';
  tip.style.top=(e.clientY-r.top+14)+'px';
  tip.classList.add('show');
}
let lastSpawn=null;
function markSpawn(i,recentre){
  if(lastSpawn!==null){spawnEls[lastSpawn].classList.remove('on');spawnRows[lastSpawn].classList.remove('on');}
  lastSpawn=i; spawnEls[i].classList.add('on'); spawnRows[i].classList.add('on');
  if(recentre)centreOn({x:SPAWNS[i].x,z:SPAWNS[i].z,w:0,d:0});
}

let last=null;
function mark(i,recentre){
  if(last!==null){pins[last].b.classList.remove('on');rows[last].classList.remove('on');}
  last=i; pins[i].b.classList.add('on'); rows[i].classList.add('on');
  if(recentre)centreOn(POIS[i]);
}

const sh=document.createElement('div');
sh.className='grp'; sh.textContent='Spawn points — '+SPAWNS.length;
roster.appendChild(sh);
SPAWNS.forEach((s,i)=>{
  const r=document.createElement('button');
  r.className='row'; r.style.color='var(--ink)';
  r.innerHTML='<u>'+s.n+'</u><s>'+esc(s.biome)+'</s><var>'+s.x+', '+s.z+'</var>';
  r.addEventListener('pointerenter',()=>markSpawn(i,true));
  r.addEventListener('focus',()=>markSpawn(i,true));
  r.addEventListener('click',()=>copyXYZ(s.x,s.y,s.z));
  roster.appendChild(r); spawnRows.push(r);
});

Object.keys(PACKS).forEach(m=>{
  const g=POIS.filter(p=>p.mod===m);
  if(!g.length)return;
  const h=document.createElement('div');
  h.className='grp'; h.textContent=PACKS[m].n+' — '+g.length;
  roster.appendChild(h);
  g.forEach(p=>{
    const i=POIS.indexOf(p);
    const r=document.createElement('button');
    r.className='row'; r.style.color=PACKS[m].c;
    r.innerHTML='<u>'+p.n+'</u><s>'+esc(p.name)+'</s><var>'+p.x+', '+p.z+'</var>';
    r.addEventListener('pointerenter',()=>mark(i,true));
    r.addEventListener('focus',()=>mark(i,true));
    r.addEventListener('click',()=>copy(p));
    roster.appendChild(r); rows[i]=r;
  });
});

function legacyCopy(t){            /* file:// is not a secure context, so no async clipboard */
  const a=document.createElement('textarea');
  a.value=t; a.setAttribute('readonly','');
  a.style.cssText='position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(a); a.select(); a.setSelectionRange(0,t.length);
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  document.body.removeChild(a);
  return ok;
}
function copyXYZ(x,y,z){
  const cmd='teleport '+x+' '+y+' '+z;
  const done=()=>flash('Copied   '+cmd);
  const fall=()=>{ legacyCopy(cmd)?done():flash(cmd); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(cmd).then(done,fall);
  else fall();
}
function copy(p){ copyXYZ(p.x,p.y,p.z); }
let tId;
function flash(m){
  toast.textContent=m; toast.classList.add('show');
  clearTimeout(tId); tId=setTimeout(()=>toast.classList.remove('show'),2400);
}

Object.keys(PACKS).forEach(m=>{
  const n=POIS.filter(p=>p.mod===m).length;
  if(!n)return;
  const c=document.createElement('button');
  c.className='chip'; c.style.color=PACKS[m].c; c.setAttribute('aria-pressed','true');
  c.innerHTML='<i></i><span style="color:var(--ink-dim)">'+PACKS[m].n+'</span><em>'+n+'</em>';
  c.addEventListener('click',()=>{
    if(off.has(m))off.delete(m); else off.add(m);
    c.setAttribute('aria-pressed',off.has(m)?'false':'true');
    apply();
  });
  chips.appendChild(c);
});

document.getElementById('q').addEventListener('input',apply);
function apply(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  POIS.forEach((p,i)=>{
    const vis=!off.has(p.mod)&&(!q||p.name.toLowerCase().indexOf(q)>=0);
    pins[i].b.hidden=!(vis&&st.mk.pins);
    pins[i].fp.hidden=!(vis&&st.mk.fp);
    rows[i].hidden=!vis;
  });
  spawnEls.forEach(b=>b.hidden=!st.mk.spawn);
  const rowsVis=st.mk.spawn&&!q;                  // list hides while searching POI names
  spawnRows.forEach(r=>r.hidden=!rowsVis);
  sh.hidden=!rowsVis;
}

/* ------------------------------------------------------------ pan / zoom -- */
let s=1,tx=0,ty=0;
function draw(){
  world.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';
  layer.style.setProperty('--inv',1/s);            /* keep pins a constant screen size */
}
function fit(){s=1;tx=-world.offsetWidth/2;ty=-world.offsetHeight/2;draw();}
function zoomAt(cx,cy,f){
  const r=stage.getBoundingClientRect(),ox=cx-r.left-r.width/2,oy=cy-r.top-r.height/2;
  const ns=Math.min(9,Math.max(.6,s*f));
  tx=ox-(ox-tx)*(ns/s); ty=oy-(oy-ty)*(ns/s); s=ns; draw();
}
function centreOn(p){
  const W=world.offsetWidth,ns=Math.max(s,3.4);
  tx=-((p.x+p.w/2+4096)/8192)*W*ns;
  ty=-((4096-p.z-p.d/2)/8192)*W*ns;
  s=ns; draw();
}
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.16:1/1.16);},{passive:false});
let down=null;
stage.addEventListener('pointerdown',e=>{
  /* the stage captures the pointer to drag, which swallows the click on
     anything sitting over it - every control has to opt out here */
  if(e.target.closest('.pin,.spawn,.panel,.zoom'))return;
  down={x:e.clientX-tx,y:e.clientY-ty};
  stage.setPointerCapture(e.pointerId); stage.classList.add('drag');
});
stage.addEventListener('pointermove',e=>{
  if(down){tx=e.clientX-down.x;ty=e.clientY-down.y;draw();}
  const r=world.getBoundingClientRect();
  const x=Math.round((e.clientX-r.left)/r.width*8192-4096),
        z=Math.round(4096-(e.clientY-r.top)/r.height*8192);
  crd.textContent=(Math.abs(x)<=4096&&Math.abs(z)<=4096)?('X '+x+'   Z '+z):' ';
});
stage.addEventListener('pointerleave',()=>{crd.textContent=' ';});
addEventListener('pointerup',()=>{down=null;stage.classList.remove('drag');});
document.getElementById('zin').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.4);};
document.getElementById('zout').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.4);};
document.getElementById('zmap').onclick=()=>cycleBase(1);
document.getElementById('zfit').onclick=fit;
addEventListener('resize',fit);

/* 1-9 pick a base map, M the next one, G the grid. Guard only against text
   entry: a focused checkbox, radio or slider must not swallow the shortcuts,
   which is what happens the moment you touch anything in the Layers panel. */
const TYPING=/^(text|search|url|email|password|number|tel|date|time)$/;
addEventListener('keydown',e=>{
  const t=e.target;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(t.matches('textarea,[contenteditable=""],[contenteditable="true"]'))return;
  if(t.matches('input')&&TYPING.test(t.type))return;
  const n=+e.key;
  if(n>=1&&n<=9&&bases[n-1]){ setBase(bases[n-1].id); flash(bases[n-1].label); return; }
  if(e.key==='m'||e.key==='M'){ cycleBase(e.shiftKey?-1:1); return; }
  if(e.key==='g'||e.key==='G'){
    st.mk.grid=!st.mk.grid;
    document.querySelector('input[data-mk=grid]').checked=st.mk.grid;
    paint();
  }
});

fit(); paint();
</script>
